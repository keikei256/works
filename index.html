<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Works — LP制作の作例</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
:root{--paper:#e9e5dc;--ink:#1d1d1b;--mute:#6d6a63;--line:#1d1d1b}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Shippori Mincho",serif;min-height:100vh;padding:clamp(24px,6vw,72px) 16px}
.wrap{max-width:960px;margin:0 auto}
.en{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--mute);letter-spacing:.04em}
h1{font-weight:400;font-size:clamp(28px,5vw,48px);letter-spacing:.12em;margin:.4em 0 .6em}
p.lead{color:var(--mute);font-size:14px;line-height:2;letter-spacing:.06em;max-width:36em}
ol{list-style:none;padding:0;margin-top:clamp(40px,8vw,80px);border-top:1px solid var(--line)}
li a{display:grid;grid-template-columns:3em 1fr auto;gap:16px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;transition:padding .4s ease}
li a:hover{padding-left:12px}
.no{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:20px}
.t{font-size:clamp(17px,2.4vw,22px);letter-spacing:.1em}
.t small{display:block;font-size:12px;color:var(--mute);margin-top:6px;letter-spacing:.06em}
.arrow{font-size:18px}
footer{margin-top:48px;font-size:11px;color:var(--mute);letter-spacing:.06em;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
<span class="en">Works</span>
<h1>LP制作の作例</h1>
<p class="lead">架空の事務所やお店を想定して制作した、1ページのWebサイトです。パソコンとスマートフォンで、実際に動かしてご覧ください。</p>
<ol>
<li><a href="sharoushi/"><span class="no">01</span><span class="t">社会保険労務士・行政書士の事務所<small>はじめて人を雇う会社のための、相談申込ページ</small></span><span class="arrow">→</span></a></li>
</ol>
<footer>掲載している事務所名・人物・価格・連絡先はすべて架空です。写真は商用利用可能な素材を使用しています。</footer>
</div>
</body>
</html>
